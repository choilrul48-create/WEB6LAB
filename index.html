<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praktikum DOM dan Event</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <script src="script.js" defer></script>
  <body>
    <h1 id="judul">Latihan DOM</h1>
    <p id="pesan">Belum ada tindakan.</p>
    <button id="tombolAksi" type="button">Klik Saya</button>

    <p id="teksGaya">
      Ini adalah teks yang akan berubah gaya saat tombol di bawah diklik.
    </p>
    <button id="tombolGaya" type="button">Ubah Gaya Teks</button>
    <label for="namaInput">Nama:</label>
    <input type="text" id="namaInput" maxlength="40" />
    <p>Jumlah karakter: <span id="jumlahKarakter">0</span></p>
    <form id="formPendaftaran" novalidate>
      <label for="nama">Nama lengkap</label>
      <input id="nama" name="nama" type="text" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" />
      <label for="usia">Usia</label>
      <input id="usia" name="usia" type="number" min="17" max="100" />
      <button type="submit">Daftar</button>
    </form>
    <p id="pesanForm" aria-live="polite"></p>

    <section>
      <h2>Daftar Tugas</h2>
      <label for="inputTugas">Tugas baru</label>
      <input id="inputTugas" type="text" />
      <button id="tambahTugas" type="button">Tambah</button>
      <p id="pesanTugas" aria-live="polite"></p>
      <ul id="daftarTugas"></ul>
      <button id="hapusTugas" type="button">Hapus Semua Tugas</button>
    </section>

    <div>
      <label for="sesiWorkshop">Pilih Sesi Workshop:</label>
      <select id="sesiWorkshop">
        <option value="">-- Pilih Sesi --</option>
        <option value="Web Development Dasar">
          Web Development Dasar (Pagi)
        </option>
        <option value="JavaScript Modern DOM">
          JavaScript Modern DOM (Siang)
        </option>
        <option value="UI/UX & Tailwind CSS">
          UI/UX & Tailwind CSS (Sore)
        </option>
      </select>
    </div>

    <!-- Elemen untuk menampilkan sesi yang dipilih -->
    <p id="tampilanSesi" style="font-style: italic; color: #555"></p>

    <div style="margin-top: 20px">
      <button id="tombolTampilSembunyi" type="button">
        Sembunyikan Paragraf
      </button>
      <p id="paragrafTarget">
        Ini adalah paragraf rahasia yang bisa disembunyikan dan ditampilkan
        kembali secara dinamis menggunakan manipulasi Class CSS dan JavaScript
        DOM!
      </p>
    </div>
  </body>
</html>
